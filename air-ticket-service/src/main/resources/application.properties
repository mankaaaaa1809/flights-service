server.port=${PORT:5003}
server.error.include-message=always

# --- PostgreSQL (локально: docker compose up -d, порт 5434) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/flights}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Этот сервис ---
service.name=AirTicketService
service.base-url=${SERVICE_BASE_URL:http://localhost:5003}

# --- Регистр сервисов ---
registry.url=${REGISTRY_URL:http://localhost:8080}
# Если регистрация с таким именем уже есть - удалить (через X-Admin-Key) и зарегистрировать заново.
# Удобно при разработке; на хостинге поставить REGISTRY_REREGISTER=false.
registry.reregister=${REGISTRY_REREGISTER:true}
registry.admin-key=${ADMIN_KEY:dev-admin-key}

# --- Сервис оплаты ---
payment.url=${PAYMENT_URL:http://localhost:5002}
# Проверять токен в сервисе оплаты при первом использовании (защита от поддельных уведомлений)
payment.verify=${PAYMENT_VERIFY:true}

# --- Клиент сервиса ---
# Общий секрет: по нему клиент забирает у сервиса токены своих пользователей (скрытый метод /internal/firm-tokens)
service.client-key=${SERVICE_CLIENT_KEY:dev-client-key}
