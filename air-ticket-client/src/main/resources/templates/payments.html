<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Мои оплаты')}"></head>
<body>
<nav th:replace="~{fragments :: nav('payments')}"></nav>
<main>
  <h1>Мои оплаты</h1>
  <p class="sub">Услуги, которые вы оплатили в сервисе оплаты.</p>
  <div class="scroll">
    <table th:if="${!rows.isEmpty()}">
      <thead><tr><th>Услуга</th><th>Период</th><th>Сумма</th><th>Статус</th></tr></thead>
      <tbody>
        <tr th:each="r : ${rows}">
          <td th:text="${r.title()}"></td>
          <td class="mono small" th:text="${r.period()}"></td>
          <td class="mono" th:text="${r.price()}"></td>
          <td><span class="pill" th:classappend="${r.code()}" th:text="${r.label()}"></span></td>
        </tr>
      </tbody>
    </table>
    <div class="empty" th:if="${rows.isEmpty()}">Оплат пока нет. Выберите услугу на странице <a th:href="@{/}">«Услуги»</a>.</div>
  </div>
</main>
</body>
</html>
