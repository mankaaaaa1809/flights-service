<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Реестр')}"></head>
<body>
<nav th:replace="~{fragments :: nav('registry')}"></nav>
<main>
  <h1>Реестр сервисов</h1>
  <p class="sub">Найдите сервис, оплатите нужный метод и работайте с данными.</p>
  <form class="searchform" method="get" th:action="@{/registry}">
    <input name="q" th:value="${q}" placeholder="Поиск по имени сервиса, методу или описанию…" autofocus>
    <button class="primary">Найти</button>
  </form>
  <div class="grid">
    <a class="ticket click" th:each="s : ${list}" th:href="@{/service/{n}(n=${s.name()})}">
      <div class="t-name" th:text="${s.name()}"></div>
      <div class="mono small muted" th:text="${s.baseUrl()}"></div>
      <p class="muted" style="margin:10px 0 0" th:text="${s.description()}"></p>
      <div class="sep"></div>
      <div class="chips">
        <span class="pill" th:each="m : ${s.methods()}"
              th:classappend="${@clientState.status(s.name(), m.name()).code()}"
              th:text="${m.name() + ' · ' + m.price()}"></span>
      </div>
    </a>
    <div class="empty" style="grid-column:1/-1" th:if="${#lists.isEmpty(list)}">Ничего не найдено</div>
  </div>
</main>
</body>
</html>
