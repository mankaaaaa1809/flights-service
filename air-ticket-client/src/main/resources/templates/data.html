<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${item.title()})}"></head>
<body>
<nav th:replace="~{fragments :: nav('catalog')}"></nav>
<main id="data" th:data-method="${item.method()}" th:data-pay="@{/pay/{m}(m=${item.method()})}">
  <div class="crumbs"><a th:href="@{/}">Услуги</a> / <span th:text="${item.title()}"></span></div>
  <h1 th:text="${item.title()}">Данные</h1>
  <p class="sub">Правьте значения прямо в ячейках и нажимайте «Сохранить».</p>
  <div id="bn"></div>
  <div class="bar"><input class="grow" id="flt" placeholder="Фильтр по таблице…"><button id="reload" type="button">Обновить</button></div>
  <div class="scroll" id="tbl"><div class="empty">Загрузка…</div></div>
</main>
<div id="toast"></div>
<script th:src="@{/js/data.js}"></script>
</body>
</html>
