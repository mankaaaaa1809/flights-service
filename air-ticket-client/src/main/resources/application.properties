server.port=${PORT:5004}

# Регистр сервисов и сервис оплаты
registry.url=${REGISTRY_URL:http://localhost:8080}
payment.url=${PAYMENT_URL:http://localhost:5002}

# Организация (фирма), от имени которой клиент платит, и сервис, с которым работает
client.firm=${CLIENT_FIRM:Firm-1}
client.service-name=${CLIENT_SERVICE:AirTicketService}
# Здесь клиент хранит токены оплаты и настройки (на сервере, не в браузере)
client.data-file=${CLIENT_DATA:client-data/state.json}

spring.thymeleaf.cache=false
