server.port=${PORT:5004}
server.error.include-message=always

# --- Собственная БД клиента: пользователи и их токены оплаты (локально: docker compose up -d, порт 15435) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15435/client}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Регистр: из него клиент узнаёт адрес сервиса, его методы, пути и цены ---
registry.url=${REGISTRY_URL:http://localhost:8080}
client.service-name=${CLIENT_SERVICE:AirTicketService}

# Публичный адрес сервиса оплаты (куда пользователь переходит в браузере для оплаты)
payment.public-url=${PAYMENT_PUBLIC_URL:http://localhost:5002}

# Общий секрет с прикладным сервисом (SERVICE_CLIENT_KEY на его стороне): по нему клиент забирает токены своих пользователей
client.service-key=${SERVICE_CLIENT_KEY:dev-client-key}

spring.thymeleaf.cache=false
