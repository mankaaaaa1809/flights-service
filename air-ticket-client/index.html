<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AirTickets — клиент</title>
<style>
:root{--paper:#efe9dc;--card:#fbf8f1;--ink:#14233b;--muted:#68718a;--line:#d6cdb9;--accent:#d9480f;--on-accent:#fff;--ok:#2b7a4b;--warn:#a86a00;--err:#b3261e;--mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;--serif:Georgia,"Times New Roman",serif}
@media(prefers-color-scheme:dark){:root{--paper:#0e1829;--card:#16243a;--ink:#ece6d8;--muted:#95a0b6;--line:#2b3c57;--accent:#ff8a4c;--on-accent:#1a1206;--ok:#6cd19a;--warn:#f0b24d;--err:#ff8c84}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:12px 28px;background:var(--ink);color:var(--paper)}
nav .brand{font:700 18px var(--mono);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;margin-right:auto}
nav .brand b{color:var(--accent)}
nav a.l{text-decoration:none;padding:6px 12px;border-radius:99px;font-size:14px;opacity:.8}
nav a.l:hover{opacity:1;background:#ffffff1f}nav a.l.on{background:var(--accent);color:var(--on-accent);opacity:1;font-weight:600}
main{max-width:1160px;margin:0 auto;padding:28px 28px 80px}
h1{font:400 34px/1.1 var(--serif);margin:0 0 6px}h2{font:700 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 22px}.crumbs{font:12px var(--mono);color:var(--muted);margin-bottom:10px}.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--accent)}
input,select,button,textarea{font:inherit;color:inherit}
input,select{width:100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:9px 11px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
label{display:grid;gap:5px;font-size:12px;color:var(--muted)}
button,.btn{cursor:pointer;display:inline-block;text-decoration:none;background:transparent;border:1px solid var(--ink);border-radius:6px;padding:8px 14px;font-size:14px;line-height:1.2}
button:hover,.btn:hover{background:var(--ink);color:var(--paper)}
.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:var(--on-accent)!important;font-weight:600}.primary:hover{filter:brightness(1.1)}
.danger{border-color:var(--err);color:var(--err)}.danger:hover{background:var(--err);color:#fff}
button:disabled{opacity:.5;cursor:wait}
.search{display:flex;gap:10px;margin-bottom:22px}.search input{font-size:17px;padding:13px 16px;border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.ticket{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;box-shadow:0 2px 0 var(--line)}
.ticket.click{text-decoration:none;transition:transform .12s}.ticket.click:hover{transform:translateY(-3px);border-color:var(--accent)}
.sep{position:relative;border-top:2px dashed var(--line);margin:14px -16px}
.sep::before,.sep::after{content:"";position:absolute;top:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper)}.sep::before{left:-9px}.sep::after{right:-9px}
.t-name{font:400 22px var(--serif)}.mono{font-family:var(--mono)}.small{font-size:12px}.muted{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;font:12px var(--mono);padding:2px 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted);white-space:nowrap}
.pill.live{color:var(--ok);border-color:var(--ok)}.pill.wait{color:var(--warn);border-color:var(--warn)}.pill.expired{color:var(--err);border-color:var(--err)}.pill.price{color:var(--accent);border-color:var(--accent)}
.rows{display:grid;gap:16px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.mrow .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.form{display:grid;gap:14px;max-width:560px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.presets{display:flex;gap:8px;flex-wrap:wrap}.presets button{padding:5px 11px;border-radius:99px;font-size:13px}
.sum{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--line);padding-top:12px}.sum b{font:400 30px var(--serif);color:var(--accent)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.bar .grow{flex:1;min-width:200px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--warn);border-left-width:6px;border-radius:8px;padding:12px 16px;margin-bottom:16px;background:var(--card)}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:680px}
th{text-align:left;font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px;border-bottom:2px solid var(--ink)}
td{padding:11px 12px;border-bottom:1px dashed var(--line)}tr:last-child td{border-bottom:0}tr:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
td.act{white-space:nowrap;text-align:right}td.act button{padding:4px 10px;font-size:13px;margin-left:6px}
.empty{padding:40px;text-align:center;color:var(--muted)}
dialog{background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:24px;width:min(480px,94vw)}dialog::backdrop{background:#000a}
#toast{position:fixed;right:20px;bottom:20px;max-width:420px;padding:12px 16px;border-radius:8px;background:var(--ink);color:var(--paper);display:none;z-index:20;box-shadow:0 8px 28px #0006}#toast.err{background:var(--err);color:#fff}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--err)}
@media(max-width:640px){main{padding:20px 14px}nav{padding:10px 14px}.two{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}.mrow .acts{justify-content:flex-start}}
</style>
</head>
<body>
<nav>
  <a class="brand" href="#/">Air<b>Tickets</b></a>
  <a class="l" href="#/" data-p="/">Сервис</a>
  <a class="l" href="#/pay" data-p="/pay">Оплата</a>
  <a class="l" href="#/settings" data-p="/settings">Настройки</a>
</nav>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let cfg = { firm: 'Firm-1', registry: 'http://localhost:8080', payment: 'http://localhost:5002', service: 'AirTicketService', ...store.get('cfg', {}) };
let tokens = store.get('tokens_local', {});
const saveTokens = () => store.set('tokens_local', tokens);
const tk = m => cfg.service + '/' + m;
const url = u => u.trim().replace(/\/$/, '');
const dt = s => s ? String(s).replace('T', ' ').slice(0, 16) : '';
const pad = n => String(n).padStart(2, '0');
/* Все времена — локальные (по часам компьютера): так их сравнивают сервис оплаты и сервис билетов */
const local = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const state = t => !t ? 'none' : Date.now() < Date.parse(t.from) ? 'wait' : Date.now() > Date.parse(t.to) ? 'expired' : 'live';
const LBL = { none: 'не оплачен', wait: 'ещё не действует', live: 'действует', expired: 'истёк' };
const pill = t => { const s = state(t); return `<span class="pill ${s}">${LBL[s]}</span>`; };

function toast(msg, err) { const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 5000); }
async function http(u, o = {}) {
  let r; try { r = await fetch(u, o); } catch { throw Object.assign(new Error('Нет связи с ' + u), { net: true }); }
  const txt = await r.text(); let d = null; try { d = txt ? JSON.parse(txt) : null; } catch { d = txt; }
  if (!r.ok) throw Object.assign(new Error((d && (d.message || d.error)) || 'HTTP ' + r.status), { status: r.status, data: d });
  return d;
}
const loading = () => $('#app').innerHTML = '<div class="empty">Загрузка…</div>';
const fail = e => $('#app').innerHTML = `<div class="panel"><b style="color:var(--err)">${esc(e.message)}</b><p class="muted">Проверьте адреса и имя сервиса в <a href="#/settings">настройках</a>.</p></div>`;
async function svcInfo() {
  try { return await http(url(cfg.registry) + '/api/services/' + encodeURIComponent(cfg.service)); }
  catch (e) { if (e.status === 404) e.message = `Сервис «${cfg.service}» не найден в реестре. Он запущен и зарегистрирован?`; throw e; }
}

/* ---------- Сервис ---------- */
async function viewService() {
  loading(); let s; try { s = await svcInfo(); } catch (e) { return fail(e); }
  $('#app').innerHTML = `<h1>${esc(s.name)}</h1><p class="sub">${esc(s.description || '')}<br><span class="mono small">${esc(s.baseUrl)}</span></p><h2>Методы сервиса</h2>
    <div class="rows">${s.methods.map(m => { const t = tokens[tk(m.name)], n = encodeURIComponent(m.name);
      return `<div class="ticket"><div class="mrow"><div><div class="t-name">${esc(m.name)}</div>
        <div class="mono small muted">${esc(m.httpMethod)} ${esc(m.path)}</div><p style="margin:8px 0">${esc(m.description || '')}</p>
        <div class="chips">${m.parameters.map(p => `<span class="pill">${esc(p.name)} · ${esc(p.location)}${p.required ? '*' : ''}</span>`).join('')}</div></div>
        <div class="acts"><span class="pill price">${m.price ?? 0}</span>${pill(t)}
        <a class="btn primary" href="#/pay/${n}">Оплатить</a>${RES[m.name] ? `<a class="btn" href="#/data/${n}">Открыть</a>` : ''}</div></div></div>`; }).join('')
      || '<div class="empty">У сервиса нет платных методов</div>'}</div>`;
}

/* ---------- Оплата ---------- */
async function viewPay(sel) {
  loading(); let s; try { s = await svcInfo(); } catch (e) { return fail(e); }
  if (!s.methods.length) return fail(new Error('У сервиса нет платных методов'));
  $('#app').innerHTML = `<h1>Оплата метода</h1><p class="sub">Сервис: <b>${esc(s.name)}</b>. Токен сохранится автоматически. Время — по часам вашего компьютера.</p>
    <div class="panel" id="payBox"><form class="form" id="pf">
      <label>Метод<select id="pm">${s.methods.map(m => `<option ${m.name === sel ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></label>
      <label>Фирма (firmId)<input id="pfirm" required value="${esc(cfg.firm)}"></label>
      <div class="two"><label>Действует с<input type="datetime-local" id="pfrom" required></label><label>Действует по<input type="datetime-local" id="pto" required></label></div>
      <div class="presets" id="presets">${[[1, '1 час'], [24, '1 день'], [168, '7 дней'], [720, '30 дней']].map(p => `<button type="button" data-h="${p[0]}">${p[1]}</button>`).join('')}</div>
      <div class="sum"><span class="muted">К оплате</span><b id="psum">—</b></div><div><button class="primary" id="pgo">Оплатить</button></div></form></div>`;
  const sum = () => { const m = s.methods.find(x => x.name === $('#pm').value); $('#psum').textContent = m ? (m.price ?? 0) : '—'; };
  const setH = h => { const n = new Date(); $('#pfrom').value = local(n); $('#pto').value = local(new Date(n.getTime() + h * 36e5)); };
  $('#pm').onchange = sum; sum(); setH(24);
  $('#presets').onclick = e => { const b = e.target.closest('[data-h]'); if (b) setH(+b.dataset.h); };
  $('#pf').onsubmit = async e => {
    e.preventDefault(); const met = $('#pm').value;
    if ($('#pto').value <= $('#pfrom').value) return toast('Конец периода должен быть позже начала', true);
    const body = { firmId: $('#pfirm').value.trim(), serviceName: s.name, methodName: met, dateFrom: $('#pfrom').value + ':00', dateTo: $('#pto').value + ':00' };
    cfg.firm = body.firmId; store.set('cfg', cfg); $('#pgo').disabled = true;
    const keep = r => { tokens[tk(met)] = { token: r.token, from: body.dateFrom, to: body.dateTo, price: r.price }; saveTokens(); };
    try {
      const r = await http(url(cfg.payment) + '/api/payment/pay', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      keep(r); done(r, met, body);
    } catch (err) {
      $('#pgo').disabled = false; const r = err.data;
      if (r && r.token) { keep(r); toast(err.message + ' Токен сохранён.', true); } else toast(err.message, true);
    }
  };
  const done = (r, met, b) => { $('#payBox').innerHTML = `<h2>Оплата принята</h2><div class="t-name">${esc(s.name)} / ${esc(met)}</div>
    <p class="muted">${esc(r.message || '')} Период: ${dt(b.dateFrom)} — ${dt(b.dateTo)} · сумма ${r.price ?? 0}</p>
    <p>Токен получен и сохранён автоматически — вручную его вводить не нужно.</p><div class="bar">
    ${RES[met] ? `<a class="btn primary" href="#/data/${encodeURIComponent(met)}">Открыть</a>` : ''}<a class="btn" href="#/pay">Оплатить ещё</a></div>`; };
}

/* ---------- Данные сервиса (поля — как в API сервиса билетов) ---------- */
const STATUS = { CONFIRMED: 'Подтверждена', CANCELLED: 'Отменена' };
const RES = {
  Flights: { title: 'Рейсы', empty: 'Рейсов нет', path: '/api/flights',
    check: o => o.arrivalTime <= o.departureTime ? 'Прибытие должно быть позже вылета' : null,
    cols: [{ f: 'flightNumber', t: 'Рейс', mono: 1 }, { f: 'origin', t: 'Откуда' }, { f: 'destination', t: 'Куда' },
      { f: 'departureTime', t: 'Вылет', type: 'datetime-local', fmt: dt }, { f: 'arrivalTime', t: 'Прибытие', type: 'datetime-local', fmt: dt },
      { f: 'price', t: 'Цена', type: 'number', step: '0.01', fmt: v => Number(v).toFixed(2) }, { f: 'totalSeats', t: 'Всего мест', type: 'number' },
      { f: 'seatsAvailable', t: 'Свободно', ro: 1 }] },
  Bookings: { title: 'Бронирования', empty: 'Билетов нет', path: '/api/bookings',
    cols: [{ f: 'flightId', t: 'ID рейса', type: 'number' }, { f: 'flightNumber', t: 'Рейс', ro: 1, mono: 1 }, { f: 'passengerName', t: 'Пассажир' },
      { f: 'passportNumber', t: 'Паспорт', mono: 1 }, { f: 'status', t: 'Статус', type: 'select', opts: Object.keys(STATUS), fmt: v => STATUS[v] || v },
      { f: 'createdAt', t: 'Создана', ro: 1, fmt: dt }] }
};
let D = null;
async function dapi(path, o = {}) {
  const t = tokens[tk(D.method)];
  if (!t) throw Object.assign(new Error('Метод не оплачен'), { pay: true });
  try { return await http(D.base + path, { ...o, headers: { 'Content-Type': 'application/json', 'X-Payment-Token': t.token } }); }
  catch (e) { if (e.status === 401 || e.status === 403) e.pay = true; throw e; }
}
async function viewData(method) {
  const R = RES[method]; if (!R) return fail(new Error('Для метода «' + method + '» нет встроенного интерфейса'));
  loading(); let s; try { s = await svcInfo(); } catch (e) { return fail(e); }
  D = { method, R, base: url(s.baseUrl), rows: [], q: '' };
  const t = tokens[tk(method)];
  $('#app').innerHTML = `<div class="crumbs"><a href="#/">${esc(s.name)}</a> / ${esc(method)}</div><h1>${R.title}</h1>
    <p class="sub">Токен: ${pill(t)} ${t ? `<span class="mono small">${dt(t.from)} — ${dt(t.to)}</span>` : ''}</p>
    <div id="bn"></div><div class="bar"><input class="grow" id="flt" placeholder="Фильтр по таблице…"><button id="reload">Обновить</button><button class="primary" id="add">+ Добавить</button></div>
    <div class="scroll" id="tbl"></div>`;
  $('#flt').oninput = e => { D.q = e.target.value.toLowerCase(); draw(); }; $('#reload').onclick = load; $('#add').onclick = () => openForm(null);
  $('#tbl').onclick = e => { const b = e.target.closest('[data-act]'); if (!b) return; const row = D.rows.find(x => x.id === +b.closest('tr').dataset.id);
    if (b.dataset.act === 'edit') openForm(row); else del(row); };
  D.needPay = msg => { $('#bn').innerHTML = `<div class="banner"><span>${esc(msg)}</span><a class="btn primary" href="#/pay/${encodeURIComponent(method)}">Оплатить метод</a></div>`; };
  load();
}
async function load() {
  try { D.rows = await dapi(D.R.path); $('#bn').innerHTML = ''; draw(); }
  catch (e) { if (e.pay) D.needPay(e.message === 'Метод не оплачен' ? 'Метод не оплачен.' : e.message); $('#tbl').innerHTML = `<div class="empty">${e.pay ? 'Данные недоступны без оплаты' : esc(e.message)}</div>`; }
}
function draw() {
  const R = D.R, rows = D.rows.filter(r => !D.q || JSON.stringify(Object.values(r)).toLowerCase().includes(D.q));
  $('#tbl').innerHTML = rows.length ? `<table><thead><tr><th>ID</th>${R.cols.map(c => `<th>${c.t}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r =>
    `<tr data-id="${r.id}"><td class="mono muted">${r.id}</td>${R.cols.map(c => `<td class="${c.mono ? 'mono' : ''}">${esc(c.fmt ? c.fmt(r[c.f]) : r[c.f])}</td>`).join('')}
    <td class="act"><button data-act="edit">Изменить</button><button class="danger" data-act="del">Удалить</button></td></tr>`).join('')}</tbody></table>`
    : `<div class="empty">${D.rows.length ? 'Ничего не найдено' : R.empty}</div>`;
}
function openForm(row) {
  const R = D.R, dlg = $('#dlg'), cols = R.cols.filter(c => !c.ro);
  dlg.innerHTML = `<form class="form" id="ef" style="max-width:none"><h2>${row ? 'Изменить запись ' + row.id : 'Новая запись'} · ${R.title}</h2>
    ${cols.map(c => { const v = row ? row[c.f] : (c.type === 'select' ? c.opts[0] : ''); return `<label>${c.t}${c.type === 'select'
      ? `<select name="${c.f}">${c.opts.map(o => `<option value="${o}" ${o === v ? 'selected' : ''}>${esc(STATUS[o] || o)}</option>`).join('')}</select>`
      : `<input name="${c.f}" type="${c.type || 'text'}" ${c.step ? `step="${c.step}"` : ''} required value="${esc(c.type === 'datetime-local' && v ? String(v).slice(0, 16) : v)}">`}</label>`; }).join('')}
    <div class="bar" style="justify-content:flex-end;margin:0"><button type="button" id="ecancel">Отмена</button><button class="primary">Сохранить</button></div></form>`;
  dlg.showModal(); $('#ecancel').onclick = () => dlg.close();
  $('#ef').onsubmit = async e => {
    e.preventDefault(); const o = {};
    for (const c of cols) { let v = e.target.elements[c.f].value; if (c.type === 'number') v = Number(v); if (c.type === 'datetime-local' && v.length === 16) v += ':00'; o[c.f] = v; }
    const bad = R.check && R.check(o); if (bad) return toast(bad, true);
    try { await dapi(R.path + (row ? '/' + row.id : ''), { method: row ? 'PUT' : 'POST', body: JSON.stringify(o) }); dlg.close(); toast(row ? 'Сохранено' : 'Добавлено'); load(); }
    catch (err) { if (err.pay) { dlg.close(); D.needPay(err.message); } toast(err.message, true); }
  };
}
async function del(row) {
  if (!confirm('Удалить запись ' + row.id + '?')) return;
  try { await dapi(D.R.path + '/' + row.id, { method: 'DELETE' }); toast('Удалено'); load(); } catch (e) { toast(e.message, true); }
}

/* ---------- Настройки ---------- */
function viewSettings() {
  $('#app').innerHTML = `<h1>Настройки</h1><p class="sub">Адрес сервиса билетов клиент берёт из реестра.</p>
    <div class="panel"><form class="form" id="sf"><label>Имя сервиса в реестре<input name="service" value="${esc(cfg.service)}" required></label>
    <label>Фирма (firmId)<input name="firm" value="${esc(cfg.firm)}" required></label>
    <label>Реестр сервисов<input name="registry" value="${esc(cfg.registry)}" required></label><label>Сервис оплаты<input name="payment" value="${esc(cfg.payment)}" required></label>
    <div class="bar" style="margin:0"><button class="primary">Сохранить</button><button type="button" id="ping">Проверить связь</button></div><div id="pr" class="small"></div></form></div>`;
  const read = () => { const f = $('#sf').elements; cfg = { service: f.service.value.trim(), firm: f.firm.value.trim(), registry: url(f.registry.value), payment: url(f.payment.value) }; store.set('cfg', cfg); };
  $('#sf').onsubmit = e => { e.preventDefault(); read(); toast('Сохранено'); };
  $('#ping').onclick = async () => { read(); const chk = async (n, u) => { try { await http(u); return `<div><span class="dot ok"></span>${n}: доступен</div>`; } catch (e) { return `<div><span class="dot bad"></span>${n}: ${esc(e.message)}</div>`; } };
    $('#pr').innerHTML = await chk('Реестр', cfg.registry + '/api/health') + await chk('Оплата', cfg.payment + '/api/payment/status')
      + await svcInfo().then(s => `<div><span class="dot ok"></span>Сервис «${esc(s.name)}»: найден в реестре (${esc(s.baseUrl)})</div>`, e => `<div><span class="dot bad"></span>${esc(e.message)}</div>`); };
}

/* ---------- Роутер ---------- */
const routes = [[/^#\/?$/, viewService], [/^#\/pay(?:\/([^/]+))?$/, viewPay], [/^#\/data\/([^/]+)$/, viewData], [/^#\/settings$/, viewSettings]];
async function route() {
  const h = location.hash || '#/'; $('#app').onclick = null;
  for (const [re, fn] of routes) { const m = h.match(re); if (m) {
    const p = h.slice(1).split('/')[1] || '', cur = p === 'pay' ? '/pay' : p === 'settings' ? '/settings' : '/';
    document.querySelectorAll('nav a.l').forEach(a => a.classList.toggle('on', a.dataset.p === cur));
    return fn(...m.slice(1).map(x => x && decodeURIComponent(x))); } }
  location.hash = '#/';
}
addEventListener('hashchange', route); route();
</script>
